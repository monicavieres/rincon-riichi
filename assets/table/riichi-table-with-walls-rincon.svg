      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#2C2532" flood-opacity=".18"/>
    </filter>
    <filter id="wallShadow" x="-18%" y="-35%" width="136%" height="180%" color-interpolation-filters="sRGB">
