<svg width="1200" height="1000" viewBox="0 0 1200 1000" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mesa de riichi con muros Rincon Riichi</title>
  <desc id="desc">Junk mat cuadrado con cuatro muros de 18 pilas dobles de fichas boca abajo, indicador de vientos al centro y placa amarilla de viento de ronda.</desc>
  <defs>
