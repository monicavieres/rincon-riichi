    <linearGradient id="tileSide" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#3D319C"/>
      <stop offset="1" stop-color="#1F1B62"/>
    </linearGradient>
    <linearGradient id="roundPlate" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFE881"/>
      <stop offset=".5" stop-color="#FFD94F"/>
      <stop offset="1" stop-color="#F2B72D"/>
    </linearGradient>
    <g id="wallStackTop">
