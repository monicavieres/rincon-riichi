<svg width="760" height="90" viewBox="0 0 760 90" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tenbou 1000 puntos</title>
  <desc id="desc">Palito de 1000 puntos para riichi mahjong.</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-45%" width="110%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#302538" flood-opacity=".22"/>
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#302538" flood-opacity=".18"/>
    </filter>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFEF8"/>
      <stop offset=".54" stop-color="#FFF6E4"/>
      <stop offset="1" stop-color="#E7DCC7"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FF6D70"/>
      <stop offset="1" stop-color="#D93449"/>
    </linearGradient>
  </defs>
  <g filter="url(#shadow)">
    <rect x="20" y="17" width="720" height="56" rx="28" fill="url(#bone)" stroke="#DCD2C2" stroke-width="7"/>
    <path d="M56 45h160M544 45h160" stroke="#D7CCBD" stroke-width="6" stroke-linecap="round" opacity=".45"/>
    <circle cx="346" cy="45" r="12" fill="url(#red)"/>
    <circle cx="380" cy="45" r="12" fill="url(#red)"/>
    <circle cx="414" cy="45" r="12" fill="url(#red)"/>
  </g>
</svg>
