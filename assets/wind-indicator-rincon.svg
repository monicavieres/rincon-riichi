<svg width="900" height="900" viewBox="0 0 700 700" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Indicador de vientos Rincon Riichi</title>
  <desc id="desc">Indicador de vientos estilo placa física AMOS. Este abajo, Sur a la derecha, Oeste arriba y Norte a la izquierda, con números de pared junto a las ranuras.</desc>
  <defs>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="146%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#211827" flood-opacity=".30"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="7" stdDeviation="4" flood-color="#211827" flood-opacity=".24"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.09 0 0 0 0 0.92 0 0 0 0 0.86 0 0 0 .82 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="plate" x1="70" y1="48" x2="650" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7CD7FF"/>
      <stop offset=".48" stop-color="#55BDEB"/>
      <stop offset="1" stop-color="#2896CD"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070708"/>
      <stop offset=".45" stop-color="#1B1917"/>
      <stop offset="1" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="slotInset" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#111111"/>
      <stop offset=".5" stop-color="#3B3020"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="purple" x1="190" y1="116" x2="585" y2="585" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6756DA"/>
      <stop offset=".52" stop-color="#4D3EB8"/>
      <stop offset="1" stop-color="#332A8D"/>
    </linearGradient>
    <linearGradient id="screen" x1="266" y1="319" x2="434" y2="397" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2D3540"/>
      <stop offset=".52" stop-color="#171C26"/>
      <stop offset="1" stop-color="#080B12"/>
    </linearGradient>
    <style>
      .kanji {
        font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", serif;
        font-weight: 900;
        fill: #111111;
        paint-order: stroke;
        stroke: #FFF8ED;
        stroke-width: 7px;
        stroke-linejoin: round;
      }
      .east-kanji { fill: #F04A36; }
      .num {
        font-family: "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
        font-weight: 900;
        fill: #FFF6DC;
        paint-order: stroke;
        stroke: #2F2984;
        stroke-width: 6px;
        stroke-linejoin: round;
      }
      .center-label {
        font-family: "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
        font-weight: 900;
        fill: #48EFE3;
        filter: url(#glow);
      }
    </style>
  </defs>

  <g filter="url(#shadow)">
    <rect x="48" y="48" width="604" height="604" rx="34" fill="url(#plate)"/>
    <rect x="48" y="48" width="604" height="604" rx="34" stroke="#1D6F98" stroke-width="5" opacity=".24"/>

    <path d="M205 48H495V106C495 124.2 480.2 139 462 139H238C219.8 139 205 124.2 205 106V48Z" fill="#060606"/>
    <path d="M205 652H495V594C495 575.8 480.2 561 462 561H238C219.8 561 205 575.8 205 594V652Z" fill="#060606"/>
    <path d="M48 205H106C124.2 205 139 219.8 139 238V462C139 480.2 124.2 495 106 495H48V205Z" fill="#060606"/>
    <path d="M652 205H594C575.8 205 561 219.8 561 238V462C561 480.2 575.8 495 594 495H652V205Z" fill="#060606"/>

    <rect x="236" y="70" width="228" height="40" rx="10" fill="url(#slotInset)"/>
    <rect x="236" y="590" width="228" height="40" rx="10" fill="url(#slotInset)"/>
    <rect x="70" y="236" width="40" height="228" rx="10" fill="url(#slotInset)"/>
    <rect x="590" y="236" width="40" height="228" rx="10" fill="url(#slotInset)"/>

    <rect x="160" y="92" width="58" height="132" rx="13" fill="url(#slot)" transform="rotate(-45 189 158)"/>
    <rect x="482" y="476" width="58" height="132" rx="13" fill="url(#slot)" transform="rotate(-45 511 542)"/>
  </g>

  <g filter="url(#softShadow)">
    <path d="M350 153C404 153 428 195 428 243V273H458C506 273 542 298 542 350C542 402 506 427 458 427H428V457C428 505 404 547 350 547C296 547 272 505 272 457V427H242C194 427 158 402 158 350C158 298 194 273 242 273H272V243C272 195 296 153 350 153Z" fill="url(#purple)" stroke="#2B247E" stroke-width="5"/>
    <rect x="235" y="116" width="230" height="48" rx="10" fill="url(#purple)" stroke="#2B247E" stroke-width="4"/>
    <rect x="235" y="536" width="230" height="48" rx="10" fill="url(#purple)" stroke="#2B247E" stroke-width="4"/>
    <rect x="116" y="235" width="48" height="230" rx="10" fill="url(#purple)" stroke="#2B247E" stroke-width="4"/>
    <rect x="536" y="235" width="48" height="230" rx="10" fill="url(#purple)" stroke="#2B247E" stroke-width="4"/>
  </g>

  <g text-anchor="middle">
    <g transform="rotate(180 350 140)">
      <text x="350" y="151" font-size="31" class="num">3 · 7 · 11</text>
    </g>
    <g transform="rotate(180 350 225)">
      <text x="350" y="245" font-size="48" class="kanji">西</text>
    </g>

    <text x="350" y="571" font-size="31" class="num">5 · 9</text>
    <text x="350" y="512" font-size="56" class="kanji east-kanji">東</text>

    <g transform="translate(140 350) rotate(90)">
      <text x="0" y="11" font-size="29" class="num">4 · 8 · 12</text>
    </g>
    <g transform="translate(230 350) rotate(90)">
      <text x="0" y="18" font-size="50" class="kanji">北</text>
    </g>

    <g transform="translate(560 350) rotate(-90)">
      <text x="0" y="11" font-size="29" class="num">2 · 6 · 10</text>
    </g>
    <g transform="translate(470 350) rotate(-90)">
      <text x="0" y="18" font-size="50" class="kanji">南</text>
    </g>
  </g>

  <g>
    <circle cx="350" cy="350" r="82" stroke="#EEE9FF" stroke-width="5"/>
    <circle cx="350" cy="350" r="62" stroke="#EEE9FF" stroke-width="3" opacity=".86"/>
    <path d="M350 263L368 330L437 312L387 360L437 408L368 390L350 457L332 390L263 408L313 360L263 312L332 330L350 263Z" fill="#F7F2FF" opacity=".92"/>
    <rect x="266" y="319" width="168" height="78" rx="16" fill="url(#screen)" stroke="#6D7280" stroke-width="5"/>
    <text x="350" y="350" text-anchor="middle" font-size="28" class="center-label">East 1</text>
    <text x="350" y="382" text-anchor="middle" font-size="27" class="center-label">東 1 局</text>
  </g>
</svg>
