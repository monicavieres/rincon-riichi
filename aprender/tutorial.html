<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" href="../assets/logo-rincon-riichi.svg">
    <link rel="stylesheet" href="../css/styles.css?v=hero-clean-1">
    <link rel="stylesheet" href="../css/ref.css?v=mobile-responsive-2">

    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body class="ref-body">
    <div class="soft-bg" aria-hidden="true"><span class="bubble bubble-green"></span><span class="bubble bubble-pink"></span><span class="bubble bubble-blue"></span></div>
    <main class="app-shell ref-shell">
        <nav class="topbar" id="topbar">
            <a class="brand" href="../index.html#aprender"><img class="brand-logo" src="../assets/logo-rincon-riichi.svg" alt="Rincón Riichi"><img class="brand-mark" src="../assets/favicon-64.png" alt="Rincón Riichi"></a>
            <button class="menu-toggle" id="menuToggle" aria-label="Menú" aria-expanded="false" aria-controls="topbar-controls"><span class="menu-bars" aria-hidden="true"></span></button>
            <span class="topbar-title">Tutorial</span>
            <div class="topbar-controls" id="topbar-controls"><a class="pill blue" href="../index.html#aprender">← Back</a><label class="language-picker"><span>Idioma</span><select id="languageSelect"><option value="es">ES</option><option value="en">EN</option><option value="pt">PT</option></select></label><div class="theme-radio" role="radiogroup" aria-label="Tema" title="Tema"><label class="theme-option"><input type="radio" name="theme" value="light" aria-label="Tema claro"><span class="theme-option-pill" aria-hidden="true">☀️</span></label><label class="theme-option"><input type="radio" name="theme" value="dark" aria-label="Tema oscuro"><span class="theme-option-pill" aria-hidden="true">🌙</span></label></div></div>

        <section class="tutor" aria-label="Tutorial">
            <div class="tutor-scene" id="tutorScene"></div>
            <div class="tutor-text">
                <span class="tutor-step" id="tutorStepNum"></span>
                <h2 class="tutor-title" id="tutorTitle"></h2>
                <p class="tutor-body" id="tutorBody"></p>
            </div>
            <div class="tutor-nav">
                <button class="tutor-arrow" id="tutorPrev" aria-label="Anterior">←</button>
                <div class="tutor-dots" id="tutorDots"></div>
                <button class="tutor-arrow" id="tutorNext" aria-label="Siguiente">→</button>
            </div>
        </section>
    </main>

    <script src="../js/tutorial.js?v=tutorial-1"></script>
    <script src="../js/menu.js?v=theme-radio-1"></script>
