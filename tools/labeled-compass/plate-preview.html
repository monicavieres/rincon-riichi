<!doctype html><meta charset="utf-8"><style>
body{margin:0;padding:22px 26px;width:900px;background:#f1e4c6;font-family:Helvetica,sans-serif;color:#2b2540}
h1{margin:0 0 4px;font:400 24px Cochin,Georgia,serif;color:#4a3a8c}p{margin:0 0 14px;font-style:italic}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 24px}.c{display:grid;gap:8px;justify-items:center}
.c b{font-size:12px;text-transform:uppercase;color:#4a3a8c}.row{display:flex;gap:18px}
.plate{position:relative;display:grid;place-items:center;width:120px;height:80px;border:4px solid #23203f;border-radius:10px;background:#f08a30;color:#fff6e5;font:700 48px 'Hiragino Mincho ProN','Noto Serif JP',serif;box-shadow:0 4px 0 #a8551a}
.plate i{position:absolute;top:5px;right:7px;display:grid;place-items:center;min-width:20px;height:20px;padding:0 3px;border-radius:5px;background:#fff8ed;color:#171513;font:800 13px/1 Helvetica,sans-serif;font-style:normal;border:1.5px solid #23203f}
.small .plate{width:48px;height:32px;font-size:20px;border-width:2.5px;border-radius:6px}.small .plate i{top:2px;right:2px;min-width:10px;height:10px;font-size:7px;border-radius:3px;border-width:1px;padding:0 1px}
</style><h1>Placa del viento de ronda · propuesta</h1><p>La letra va en la esquina superior derecha, según el idioma de la página. Abajo, a tamaño de uso.</p>

<div class="c"><b>Español</b><div class="row"><span class="plate">東<i>E</i></span><span class="plate">南<i>S</i></span></div><div class="row small"><span class="plate">東<i>E</i></span><span class="plate">南<i>S</i></span></div></div>

<div class="c"><b>Português</b><div class="row"><span class="plate">東<i>L</i></span><span class="plate">南<i>S</i></span></div><div class="row small"><span class="plate">東<i>L</i></span><span class="plate">南<i>S</i></span></div></div>
